[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfit"
version = "0.1.0"
description = "Evidence-backed resume and job description matching"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.68.0",
    "pdfplumber>=0.11.0",
    "pydantic-settings>=2.6.0",
    "python-docx>=1.1.2",
    "rapidfuzz>=3.10.0",
    "structlog>=24.4.0",
    "trafilatura>=2.0.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["api*", "cache*", "jobfetch*", "jobfit*"]

[tool.setuptools.data-files]
"share/jobfit/prompts/v1" = [
    "prompts/v1/job_analysis.txt",
    "prompts/v1/matching.txt",
    "prompts/v1/resume_analysis.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "integration: makes calls to an external service",
    "eval: runs real-model quality evaluations",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["jobfit"]